name: DevFlow quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check . && black --check .
      - run: pytest -q --junitxml=../reports/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devflow-part-backend-${{ github.run_attempt }}
          path: reports/backend.xml
          retention-days: 14
          if-no-files-found: warn
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format:check
      - run: pnpm exec vitest run --reporter=default --reporter=junit --outputFile=../reports/frontend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devflow-part-frontend-${{ github.run_attempt }}
          path: reports/frontend.xml
          retention-days: 14
          if-no-files-found: warn
      - run: pnpm build
  test-evidence:
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: devflow-part-*-${{ github.run_attempt }}
          merge-multiple: true
          path: reports
      - run: |
          mkdir -p reports
          printf '%s\n' '{"version":1,"expected_reports":["backend.xml","frontend.xml"]}' > reports/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: devflow-junit-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/backend/api/health
          curl --fail -X POST http://localhost:8080/backend/api/demo/seed
          curl --fail http://localhost:8080/backend/api/metrics?mode=demo
      - if: always()
        run: docker compose logs && docker compose down
  public-demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devflow-public .
      - run: |
          docker run -d --name public-demo -p 8081:8000 devflow-public
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8081/api/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8081/ | grep 'root'
          curl --fail http://localhost:8081/api/capabilities | grep '"read_only":true'
          curl --fail http://localhost:8081/api/tasks | grep 'synthetic\|示例'
          curl --fail http://localhost:8081/api/reports/download -o /tmp/report.md
          test -s /tmp/report.md
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/demo/seed)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/missing)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/.env)" = "404"
      - if: always()
        run: docker logs public-demo; docker rm -f public-demo
