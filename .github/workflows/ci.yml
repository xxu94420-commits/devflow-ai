name: DevFlow quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check . && black --check . && pytest -q
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm test && pnpm build
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/backend/api/health
          curl --fail -X POST http://localhost:8080/backend/api/demo/seed
          curl --fail http://localhost:8080/backend/api/metrics?mode=demo
      - if: always()
        run: docker compose logs && docker compose down
