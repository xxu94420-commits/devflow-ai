services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite:////data/devflow.db}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DEVFLOW_API_KEY: ${DEVFLOW_API_KEY:-}
      READ_ONLY: ${READ_ONLY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - devflow-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  devflow-data:
